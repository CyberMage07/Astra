[project]
name = "astra"
version = "0.1.0"
description = "Modular static and dynamic malware analysis platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Astra Development Team" },
]
keywords = [
    "malware-analysis",
    "cybersecurity",
    "static-analysis",
    "dynamic-analysis",
    "digital-forensics",
]
dependencies = [
    "httpx>=0.24.1",
    "platformdirs>=4.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.0.3",
    "python-magic>=0.4.27",
    "rich>=13.8.1",
    "structlog>=23.1.0",
    "textual>=0.43.2",
    "typer>=0.19.1",
]

[project.scripts]
astra = "apps.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.79.4",
    "mypy>=1.4.1",
    "pre-commit>=2.21.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.21.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps", "src/analyzers", "src/packages", "src/plugins", "src/rules", "src/sandbox"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
pretty = true
show_error_codes = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.uv]
package = true
